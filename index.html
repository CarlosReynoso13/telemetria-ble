<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width,initial-scale=1.0,user-scalable=no'>
    <title>Auto Tracker Pro BLE</title>
    
    <!-- Leaflet CSS para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 12px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
        .title-group { display: flex; align-items: center; gap: 8px; }
        h2 { color: #00ff88; margin: 0; letter-spacing: 1.2px; font-size: 1.1em; }
        
        /* Indicador Heartbeat */
        .hb-pill { display: flex; align-items: center; gap: 6px; background: #161616; border: 1px solid #333; padding: 4px 10px; border-radius: 20px; font-size: 0.72em; font-weight: bold; color: #aaa; }
        .hb-dot { width: 9px; height: 9px; border-radius: 50%; background: #555; transition: background 0.15s, box-shadow 0.15s; }
        .hb-dot.alive { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .hb-dot.pulse { background: #ffffff; box-shadow: 0 0 12px #00ff88; }
        .hb-dot.dead { background: #ff003c; box-shadow: 0 0 10px #ff003c; animation: blink 0.6s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        #btn-connect { background: #00b3ff; color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.85em; font-weight: bold; cursor: pointer; box-shadow: 0 2px 10px rgba(0, 179, 255, 0.35); transition: 0.2s; }
        #btn-connect:active { transform: scale(0.95); }

        /* Barra de Pestañas */
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; background: #161616; padding: 5px; border-radius: 10px; border: 1px solid #222; }
        .tab-btn { flex: 1; background: transparent; color: #888; border: none; padding: 10px; border-radius: 7px; font-size: 0.95em; font-weight: bold; letter-spacing: 1px; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: #00b3ff; color: #000; }

        /* Contenido de Pestañas */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Pestaña Motor */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; transition: opacity 0.3s; }
        .grid.stale { opacity: 0.35; }
        .card { background: #161616; border-radius: 12px; padding: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); border: 2px solid #222; transition: 0.3s; }
        #c-rpm { grid-column: span 2; padding: 18px; }
        #c-rpm .val { font-size: 3.3em; margin-top: -38px; }
        #c-rpm svg { max-height: 130px; }
        .alarm { animation: pulse 0.5s infinite alternate; border-color: #ff003c; }
        @keyframes pulse { from { box-shadow: 0 0 10px #300; } to { box-shadow: 0 0 25px #ff003c; transform: scale(1.02); } }
        svg { width: 100%; max-height: 75px; overflow: visible; margin: 10px 0; }
        .bg { fill: none; stroke: #333; stroke-width: 10; stroke-linecap: round; }
        .fg { fill: none; stroke: #00b3ff; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.2s ease-out, stroke 0.4s; stroke-dasharray: 125.6; stroke-dashoffset: 125.6; }
        .val { font-size: 1.8em; font-weight: bold; margin-top: -20px; }
        .unit { font-size: 0.4em; color: #888; margin-left: 3px; }
        .lbl { color: #aaa; font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px; }

        /* Pestaña Mapa */
        #map-container { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #222; }
        #map { width: 100%; height: 60vh; background: #111; }
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        .map-hud { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .hud-box { background: #161616; border: 1px solid #222; border-radius: 10px; padding: 10px; }
        .hud-val { font-family: monospace; font-size: 0.95em; color: #00ff88; margin-top: 4px; font-weight: bold; word-break: break-word; }
        .map-controls { display: flex; gap: 8px; margin-top: 10px; }
        .ctrl-btn { flex: 1; background: #1c1c1c; color: #ddd; border: 1px solid #333; padding: 10px; border-radius: 8px; font-size: 0.85em; font-weight: bold; cursor: pointer; }
        .ctrl-btn.on { border-color: #00ff88; color: #00ff88; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-group">
            <h2>TIIDA PRO</h2>
            <div class="hb-pill">
                <div class="hb-dot" id="hb-dot"></div>
                <span id="hb-text">OFFLINE</span>
            </div>
        </div>
        <button id="btn-connect">VINCULAR</button>
    </div>

    <!-- Selector de Pestañas -->
    <div class="tabs">
        <button class="tab-btn active" id="btn-tab-motor" onclick="switchTab('motor')">MOTOR</button>
        <button class="tab-btn" id="btn-tab-mapa" onclick="switchTab('mapa')">MAPA</button>
    </div>

    <!-- PESTAÑA 1: MOTOR -->
    <div id="tab-motor" class="tab-content active">
        <div class='grid stale' id='dash'></div>
    </div>

    <!-- PESTAÑA 2: MAPA -->
    <div id="tab-mapa" class="tab-content">
        <div id="map-container">
            <div id="map"></div>
        </div>

        <div class="map-hud">
            <div class="hud-box">
                <div class="lbl">VELOCIDAD</div>
                <div class="hud-val"><span id="m-spd">0</span> km/h</div>
            </div>
            <div class="hud-box">
                <div class="lbl">FUENTE GPS</div>
                <div class="hud-val" id="v-gps-src">CONSULTANDO...</div>
            </div>
            <div class="hud-box" style="grid-column: span 2;">
                <div class="lbl">COORDENADAS (<span id="v-sats">0</span> SATS)</div>
                <div class="hud-val"><span id="v-lat">0.000000</span>, <span id="v-lon">0.000000</span></div>
            </div>
        </div>

        <div class="map-controls">
            <button class="ctrl-btn on" id="btn-follow" onclick="toggleFollow()">SEGUIR: ON</button>
            <button class="ctrl-btn" onclick="clearRoute()">LIMPIAR RUTA</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 1. CONFIGURACIÓN DE MEDIDORES (MOTOR) ---
        const cfg = [
            { id: 'rpm', lbl: 'Motor', u: 'RPM', m0: 0, m1: 7000, w1: 4500, d1: 5500 },
            { id: 'spd', lbl: 'Velocidad', u: 'km/h', m0: 0, m1: 200, w1: 120, d1: 160 },
            { id: 'tmp', lbl: 'Refrigerante', u: '&deg;C', m0: 40, m1: 120, w1: 100, d1: 110 },
            { id: 'load', lbl: 'Carga', u: '%', m0: 0, m1: 100, w1: 85, d1: 95 },
            { id: 'throt', lbl: 'Acelerador', u: '%', m0: 0, m1: 100, w1: 80 },
            { id: 'bat', lbl: 'Bateria', u: 'V', m0: 9, m1: 16, w1: 14.8, d1: 15.2, w2: 11.8, d2: 11.2 },
            { id: 'iat', lbl: 'Temp Aire', u: '&deg;C', m0: 10, m1: 80, w1: 65, d1: 75 },
            { id: 'maf', lbl: 'Flujo MAF', u: 'g/s', m0: 0, m1: 150 },
            { id: 'adv', lbl: 'Avance', u: '&deg;', m0: -20, m1: 60 }
        ];

        let html = '';
        cfg.forEach(c => {
            html += `<div class='card' id='c-${c.id}'><div class='lbl'>${c.lbl}</div>
            <svg viewBox='0 0 100 55'><path class='bg' d='M 10 50 A 40 40 0 0 1 90 50'/>
            <path class='fg' id='p-${c.id}' d='M 10 50 A 40 40 0 0 1 90 50'/></svg>
            <div class='val' id='v-${c.id}'>0<span class='unit'>${c.u}</span></div></div>`;
        });
        document.getElementById('dash').innerHTML = html;

        function upd(id, val) {
            let c = cfg.find(x => x.id === id);
            let pct = (val - c.m0) / (c.m1 - c.m0);
            if (pct < 0) pct = 0; if (pct > 1) pct = 1;
            
            document.getElementById('p-' + id).style.strokeDashoffset = 125.6 * (1 - pct);
            document.getElementById('v-' + id).innerHTML = val + `<span class='unit'>${c.u}</span>`;
            
            let col = '#00b3ff'; let alm = false;
            if (c.d1 && val >= c.d1) { col = '#ff003c'; alm = true; }
            else if (c.w1 && val >= c.w1) { col = '#ffaa00'; }
            if (c.d2 && val <= c.d2) { col = '#ff003c'; alm = true; }
            else if (c.w2 && val <= c.w2) { col = '#ffaa00'; }
            
            document.getElementById('p-' + id).style.stroke = col;
            document.getElementById('c-' + id).className = alm ? 'card alarm' : 'card';
        }

        // --- 2. CONFIGURACIÓN DEL MAPA (OPENSTREETMAP OSCURO) ---
        let followCar = true;
        let hasFirstFix = false;
        let bleHasValidGps = false;

        const map = L.map('map', { zoomControl: false }).setView([20.7245, -103.3626], 15);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const carMarker = L.circleMarker([20.7245, -103.3626], {
            radius: 8, fillColor: '#00ff88', color: '#ffffff', weight: 2, opacity: 1, fillOpacity: 1
        }).addTo(map);

        const routeLine = L.polyline([], {
            color: '#00b3ff', weight: 4, opacity: 0.85
        }).addTo(map);

        function updateMap(lat, lon, sourceLabel, satsCount) {
            if (Math.abs(lat) < 0.01 && Math.abs(lon) < 0.01) return;

            const pos = [lat, lon];
            carMarker.setLatLng(pos);
            routeLine.addLatLng(pos);

            document.getElementById('v-lat').innerText = lat.toFixed(6);
            document.getElementById('v-lon').innerText = lon.toFixed(6);
            document.getElementById('v-gps-src').innerText = sourceLabel;
            if (satsCount !== null) document.getElementById('v-sats').innerText = satsCount;

            if (!hasFirstFix) {
                map.setView(pos, 16);
                hasFirstFix = true;
            } else if (followCar) {
                map.panTo(pos, { animate: true, duration: 0.5 });
            }
        }

        // --- 3. CONSULTA REMOTA A LA NUBE (GOOGLE SHEETS) ---
        const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxdT-jvtJnbUrmV6-dacKz-dSzLexkrbpvoSo-Cd3QqSMdVCFCuf8bz2iJyLIEvdNFbhw/exec";

        async function fetchCloudLocation() {
            if (bleHasValidGps) return;

            try {
                const res = await fetch(CLOUD_URL);
                const data = await res.json();

                if (data.lat && data.lon) {
                    document.getElementById('m-spd').innerText = Math.round(data.spd || 0);
                    const label = data.timestamp ? `NUBE (${data.timestamp})` : 'AUTO (NUBE)';
                    updateMap(data.lat, data.lon, label, data.sats ?? '--');
                }
            } catch (err) {
                console.warn("Error leyendo ubicación de la nube:", err);
                document.getElementById('v-gps-src').innerText = "NUBE OFFLINE";
            }
        }

        // Consultar al abrir y cada 15 segundos mientras no haya BLE activo
        fetchCloudLocation();
        setInterval(fetchCloudLocation, 15000);

        function toggleFollow() {
            followCar = !followCar;
            const btn = document.getElementById('btn-follow');
            btn.innerText = followCar ? 'SEGUIR: ON' : 'SEGUIR: OFF';
            btn.className = followCar ? 'ctrl-btn on' : 'ctrl-btn';
        }

        function clearRoute() {
            routeLine.setLatLngs([]);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('btn-tab-' + tabName).classList.add('active');
            if (tabName === 'mapa') setTimeout(() => map.invalidateSize(), 100);
        }

        // --- 4. GESTIÓN BLE CON HEARTBEAT Y RECONEXIÓN AUTOMÁTICA ---
        let bleDevice = null;
        let lastPacketTime = 0;
        let isReconnecting = false;
        let reconnectTimer = null;

        const btnConnect = document.getElementById('btn-connect');
        const hbDot = document.getElementById('hb-dot');
        const hbText = document.getElementById('hb-text');
        const dashEl = document.getElementById('dash');

        function setBleStatus(state) {
            if (state === 'alive') {
                btnConnect.style.background = '#00ff88';
                btnConnect.innerText = 'EN LÍNEA';
                hbDot.className = 'hb-dot alive';
                hbText.innerText = 'EN VIVO';
                hbText.style.color = '#00ff88';
                dashEl.classList.remove('stale');
            } else if (state === 'reconnecting') {
                btnConnect.style.background = '#ffaa00';
                btnConnect.innerText = 'BUSCANDO...';
                hbDot.className = 'hb-dot dead';
                hbText.innerText = 'RECONECTANDO';
                hbText.style.color = '#ffaa00';
                dashEl.classList.add('stale');
                bleHasValidGps = false;
            } else {
                btnConnect.style.background = '#ff003c';
                btnConnect.innerText = 'SIN SEÑAL';
                hbDot.className = 'hb-dot dead';
                hbText.innerText = 'CAÍDO';
                hbText.style.color = '#ff003c';
                dashEl.classList.add('stale');
                bleHasValidGps = false;
            }
        }

        function onBlePacket(e) {
            lastPacketTime = Date.now();
            setBleStatus('alive');

            hbDot.className = 'hb-dot pulse';
            setTimeout(() => { if (Date.now() - lastPacketTime < 3500) hbDot.className = 'hb-dot alive'; }, 150);

            let v = new DataView(e.target.value.buffer);
            
            let spd = v.getUint8(2);
            upd('rpm', v.getUint16(0, true));
            upd('spd', spd);
            upd('tmp', v.getInt8(3));
            upd('bat', (v.getUint8(4) / 10.0).toFixed(1)); 
            upd('load', v.getUint8(5));
            upd('iat', v.getInt8(6));
            upd('maf', v.getUint8(7));
            upd('throt', v.getUint8(8));
            upd('adv', v.getInt8(9));

            let lat = v.getFloat32(10, true);
            let lon = v.getFloat32(14, true);
            let sats = v.getUint8(18);

            if (Math.abs(lat) > 0.01 && Math.abs(lon) > 0.01) {
                bleHasValidGps = true;
                document.getElementById('m-spd').innerText = spd;
                updateMap(lat, lon, 'AUTO (BLE)', sats);
            } else {
                bleHasValidGps = false;
            }
        }

        async function connectGatt() {
            if (!bleDevice || isReconnecting) return;
            isReconnecting = true;
            setBleStatus('reconnecting');

            try {
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService('000000ff-0000-1000-8000-00805f9b34fb');
                const characteristic = await service.getCharacteristic('0000ff01-0000-1000-8000-00805f9b34fb');
                
                characteristic.removeEventListener('characteristicvaluechanged', onBlePacket);
                characteristic.addEventListener('characteristicvaluechanged', onBlePacket);
                await characteristic.startNotifications();
                
                lastPacketTime = Date.now();
                isReconnecting = false;
                setBleStatus('alive');
            } catch (err) {
                isReconnecting = false;
                setBleStatus('dead');
                scheduleReconnect();
            }
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(() => {
                if (bleDevice && !bleDevice.gatt.connected) {
                    connectGatt();
                }
            }, 3000);
        }

        // Watchdog: detecta si el BLE se congeló (> 3.5s sin paquetes)
        setInterval(() => {
            if (bleDevice && lastPacketTime > 0 && (Date.now() - lastPacketTime > 3500)) {
                setBleStatus('dead');
                if (!isReconnecting) {
                    try { bleDevice.gatt.disconnect(); } catch (e) {}
                    scheduleReconnect();
                }
            }
        }, 1000);

        btnConnect.addEventListener('click', async () => {
            try {
                if (!bleDevice) {
                    bleDevice = await navigator.bluetooth.requestDevice({
                        filters: [{ name: 'Auto_Tracker_BLE' }],
                        optionalServices: ['000000ff-0000-1000-8000-00805f9b34fb']
                    });
                    bleDevice.addEventListener('gattserverdisconnected', () => {
                        setBleStatus('reconnecting');
                        scheduleReconnect();
                    });
                }
                await connectGatt();
            } catch (error) {
                console.log(error);
            }
        });
    </script>
</body>
</html>
